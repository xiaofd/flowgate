name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            bin: flowgate-windows-amd64.exe
            core: fg-core-windows-amd64.exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            bin: flowgate-linux-amd64
            core: fg-core-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            bin: flowgate-linux-arm64
            core: fg-core-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # 从源码最小化构建核心（仅 wireguard + clash_api 标签，约 35MB，
      # 相比官方全功能发布版 81MB 体积减半），产物不入库、CI 现场构建
      - name: Build core
        shell: bash
        run: |
          HOST_OS="$(go env GOOS)"
          HOST_ARCH="$(go env GOARCH)"
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0
          go install -trimpath \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=1.14.1-min" \
            -tags "with_wireguard with_clash_api" \
            "github.com/sagernet/sing-box/cmd/sing-box@v1.14.1"
          SUB=""
          if [ "$GOOS" != "$HOST_OS" ] || [ "$GOARCH" != "$HOST_ARCH" ]; then
            SUB="${GOOS}_${GOARCH}/"
          fi
          SRC="$(go env GOPATH)/bin/${SUB}sing-box"
          if [ "$GOOS" = "windows" ]; then SRC="${SRC}.exe"; fi
          mkdir -p internal/assets/assets
          cp "$SRC" "internal/assets/assets/${{ matrix.core }}"
          ls -lh "internal/assets/assets/${{ matrix.core }}"

      - name: Build flowgate
        shell: bash
        run: |
          export CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.bin }}" .
          ls -lh "dist/${{ matrix.bin }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
